name: Release

on:
  push:
    tags:
      - "v*-luma.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify annotated tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          kind="$(git cat-file -t "$tag")"
          if [[ "$kind" != "tag" ]]; then
            echo "::error::$tag is a lightweight tag (${kind}). Use an annotated tag: git tag -a $tag -m '...'" >&2
            exit 1
          fi

      - name: Parse version from tag
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # v0.0.4-luma.1 -> upstream=0.0.4, luma=1
          upstream="$(echo "$tag" | sed 's/^v//; s/-luma\..*//')"
          luma="$(echo "$tag" | sed 's/.*-luma\.//')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "luma=$luma" >> "$GITHUB_OUTPUT"
          echo "display=${upstream}-luma.${luma}" >> "$GITHUB_OUTPUT"
          # Extract annotated tag message body (skip first line = tag subject)
          tag_message="$(git tag -l --format='%(contents:body)' "$tag")"
          {
            echo "tag_message<<TAG_MSG_EOF"
            echo "$tag_message"
            echo "TAG_MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify VERSION file matches upstream
        run: |
          file_version="$(cat VERSION | tr -d '[:space:]')"
          if [[ "$file_version" != "${{ steps.version.outputs.upstream }}" ]]; then
            echo "VERSION file ($file_version) does not match tag upstream version (${{ steps.version.outputs.upstream }})" >&2
            exit 1
          fi

      - name: Build universal DMG
        run: bash scripts/build-dmg.sh

      - name: Rename artifacts with luma version
        run: |
          upstream="${{ steps.version.outputs.upstream }}"
          display="${{ steps.version.outputs.display }}"
          cd dist
          mv "NumpadLuma-${upstream}-universal.dmg" "NumpadLuma-${display}-universal.dmg"
          mv "NumpadLuma-${upstream}-SHA256SUMS.txt" "NumpadLuma-${display}-SHA256SUMS.txt"
          # Recompute checksum with new filename
          shasum -a 256 "NumpadLuma-${display}-universal.dmg" > "NumpadLuma-${display}-SHA256SUMS.txt"

      - name: Run tests
        run: swift test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DISPLAY_VERSION: ${{ steps.version.outputs.display }}
          UPSTREAM_VERSION: ${{ steps.version.outputs.upstream }}
          TAG_MESSAGE: ${{ steps.version.outputs.tag_message }}
        run: |
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "## NumpadLuma ${DISPLAY_VERSION}"
            echo
            echo "Based on upstream Numpad ${UPSTREAM_VERSION}."
            if [[ -n "${TAG_MESSAGE//[[:space:]]/}" ]]; then
              echo
              echo "$TAG_MESSAGE"
            fi
            echo
            echo "## Download"
            echo
            echo "Quit the older copy, open \`NumpadLuma-${DISPLAY_VERSION}-universal.dmg\`, and replace **NumpadLuma** in **Applications**."
            echo "Supports macOS 13+ on Apple Silicon and Intel Macs."
            echo
            echo "The app is ad-hoc signed and not notarized, so Gatekeeper blocks the first launch."
            echo "Allow it from **System Settings > Privacy & Security > Open Anyway**, or run:"
            echo
            echo '```sh'
            echo "xattr -dr com.apple.quarantine /Applications/NumpadLuma.app"
            echo '```'
            echo
            echo "SHA-256 checksums are included in \`NumpadLuma-${DISPLAY_VERSION}-SHA256SUMS.txt\`."
          } > "$notes_file"
          gh release create "$TAG" \
            --title "NumpadLuma ${DISPLAY_VERSION}" \
            --notes-file "$notes_file" \
            "dist/NumpadLuma-${DISPLAY_VERSION}-universal.dmg" \
            "dist/NumpadLuma-${DISPLAY_VERSION}-SHA256SUMS.txt"
